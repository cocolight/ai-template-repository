name: build

# 新项目的 CI 门禁骨架。生成后请把下面的占位步骤换成真实命令。
# 未填写前，required status checks 是空转的（永远成功）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# runner 镜像显式钉版本，不跟随 ubuntu-latest：隐式跟随会在 GitHub 切换镜像时
# 让 CI 行为突变（例如系统依赖的包名变化）。升级镜像前请先在分支上验证依赖。
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # TODO: 按本项目技术栈补全以下三步（缺任一步，门禁即形同虚设）：
      #   1) 安装依赖
      #   2) lint / 格式检查
      #   3) 测试（不得改成 `|| true`，不得把失败降级为警告）

      - name: Test
        run: |
          echo "::warning::CI 尚未配置：请在 .github/workflows/build.yml 填写真实的安装 / lint / 测试命令"
