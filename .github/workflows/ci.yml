name: CI

# 本工作流用于测试「模板仓库自身」：校验脚本、用 example/ 当活文档跑 lint+test。
# 新项目请改用随模板生成的 .github/workflows/build.yml（本文件不会被复制进新项目）。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# runner 镜像显式钉版本，不跟随 ubuntu-latest：
# GitHub 计划于 2026-10-19 把 ubuntu-latest 迁移到 Ubuntu 26，隐式跟随会让 CI
# 在镜像切换当天突然改变行为。升级镜像前请先在分支上验证系统依赖。
jobs:
  template:
    # 注意：本 job 的 name 被 main 的分支保护（required status checks）引用，改名前先改保护设置
    name: Template (shellcheck + init dry-run)
    # tag 推送只走 release-guard，不重跑全量
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck scripts/*.sh template/scripts/*.sh template/.githooks/* .githooks/*

      # 结构类断言只有一份，在 scripts/check-fast.sh：本地 pre-commit 与这里跑同一个脚本。
      # 覆盖 AGENTS.md 行数、CHANGELOG 条目体积、payload 清单双向一致、索引模式、
      # .agents/ 路由表覆盖、两份 .gitattributes 一致、工具层文件不得混入 template/、能力同步。
      # 下面不再逐条重复这些断言 —— 两份必然漂移。
      - name: 快速门禁（工具层 + payload）
        run: ./scripts/check-fast.sh
      - name: template-init smoke test
        # dry-run 只验证参数解析；真实生成才能覆盖复制逻辑（占位文件跳过、空目录保留）。
        # 每条断言都写成"失败即 exit 1"，不依赖 errexit 的生效范围。
        run: |
          set -eu
          DST="$RUNNER_TEMP/newproj"
          ./scripts/template-init.sh --dry-run "$DST"
          ./scripts/template-init.sh "$DST"

          # --- 复制结果断言 ---
          # find 排除 .git：git init 之后产物里已有 .git，不排除会白跑大量文件
          test "$(find "$DST" -name .gitkeep -not -path '*/.git/*' | wc -l)" -eq 0 || { echo "产物里出现了 .gitkeep"; exit 1; }
          for d in src tests scripts; do
            [ -d "$DST/$d" ] || { echo "产物缺少目录：$d"; exit 1; }
          done
          ! grep -rqE '\{\{(PROJECT_NAME|YEAR)\}\}' "$DST" --exclude-dir=.git || { echo "产物仍有未替换的占位符"; exit 1; }
          [ "$(git -C "$DST" branch --show-current)" = main ] || { echo "默认分支不是 main"; exit 1; }

          # --- 白名单反向断言：工具层文件不得进入产物 ---
          # 复制源是 template/，这些文件物理上就不在复制源里。
          # 注意：不要把 .github/pull_request_template.md 加进本清单 ——
          # 产物里有 payload 自带的同名文件，加了必假阳。
          for f in template TEMPLATE.md payload.txt example scripts/template-init.sh .github/workflows/ci.yml; do
            [ ! -e "$DST/$f" ] || { echo "产物泄露了工具层文件：$f"; exit 1; }
          done
          # .workbuddy 是本地 AI 工具数据，在仓库根；白名单已天然排除，此处显式断言
          [ ! -e "$DST/.workbuddy" ] || { echo "产物泄露了 .workbuddy/"; exit 1; }
          # 工程文档在 .agents/，docs/ 全归使用者，模板不预置任何文件
          [ ! -e "$DST/docs" ] || { echo "产物不应预置 docs/：工程文档属于 .agents/"; exit 1; }

          # --- 正向断言：payload 必须真的复制到位 ---
          # 仅有反向断言时，复制阶段整体失效会全绿通过（例如 .gitkeep 数=0、
          # 无 example、无占位符、分支为 main），所以必须逐个确认关键文件存在。
          for f in README.md AGENTS.md ROADMAP.md CONTRIBUTING.md CHANGELOG.md LICENSE \
                   THIRD-PARTY.md \
                   .gitignore .gitattributes \
                   .github/workflows/build.yml \
                   .githooks/pre-commit scripts/check-fast.sh \
                   .agents/architecture.md .agents/configuration.md .agents/definition-of-done.md \
                   .agents/releasing.md .agents/extension-points.md \
                   .agents/skills/README.md \
                   .agents/adr/README.md .agents/adr/0001-record-architecture-decisions.md; do
            [ -f "$DST/$f" ] || { echo "产物缺少文件：$f"; exit 1; }
          done
          [ -d "$DST/.github/workflows" ] || { echo "产物缺少目录：.github/workflows"; exit 1; }
          [ "$(ls "$DST/.github/workflows" | wc -l)" -eq 1 ] || { echo "产物里不止 build.yml 一个 workflow"; exit 1; }

          # --- 产物自身的门禁必须能跑 ---
          # 可执行位缺失在 Windows 上本地测不出，这里连权限一起验证。
          [ -x "$DST/scripts/check-fast.sh" ] || { echo "产物里 check-fast.sh 没有可执行位"; exit 1; }
          [ -x "$DST/.githooks/pre-commit" ] || { echo "产物里 pre-commit 没有可执行位"; exit 1; }
          ( cd "$DST" && ./scripts/check-fast.sh ) || { echo "产物在初始状态下就过不了自己的门禁"; exit 1; }

          # --- 行尾规则一致性：两份 .gitattributes 必须相同 ---
          # 根那份递归覆盖 template/**（已实测），内容一致时无歧义。
          diff .gitattributes template/.gitattributes >/dev/null \
            || { echo "根 .gitattributes 与 template/.gitattributes 不一致"; exit 1; }
          git check-attr eol -- scripts/template-init.sh | grep -q 'eol: lf' \
            || { echo "scripts/template-init.sh 未被 eol=lf 覆盖"; exit 1; }

      - name: 仓库结构自检
        # 守住「两层结构」这个核心性质：根是工具层，template/ 是数据层
        run: |
          set -eu
          for p in template/README.md template/AGENTS.md template/LICENSE \
                   template/.agents/architecture.md template/.github/workflows/build.yml \
                   template/scripts/check-fast.sh template/.githooks/pre-commit; do
            [ -e "$p" ] || { echo "仓库结构异常，缺少：$p"; exit 1; }
          done
          # 工程文档在 .agents/，template/ 下不该再有 docs/
          [ ! -e template/docs ] || { echo "template/ 下不该有 docs/：工程文档属 .agents/，docs/ 归使用者"; exit 1; }
          # 工具层文件不得出现在 template/ 里（放错位置会被复制进新项目）
          for f in TEMPLATE.md payload.txt example .gitkeep.bak; do
            [ ! -e "template/$f" ] || { echo "template/ 里混入了工具层文件：$f"; exit 1; }
          done
          [ -e TEMPLATE.md ] || { echo "根 TEMPLATE.md 丢失"; exit 1; }
          [ -e payload.txt ] || { echo "根 payload.txt 丢失（唯一机器清单）"; exit 1; }
          [ -e .github/pull_request_template.md ] || { echo "根 .github/pull_request_template.md 丢失"; exit 1; }
          [ -e example/README.md ] || { echo "example/ 丢失"; exit 1; }
          # build.yml 必须只在 template/ 下（留在根上会让本仓库跑一个空壳 job）
          [ ! -e .github/workflows/build.yml ] || { echo "build.yml 仍在根 .github/workflows/，必须移入 template/"; exit 1; }
          [ -e .github/workflows/ci.yml ] || { echo "根 ci.yml 丢失"; exit 1; }
          [ -e .githooks/pre-commit ] || { echo "根 .githooks/pre-commit 丢失"; exit 1; }

      - name: 产物内文档死链检查
        # 生成本身不校验文档引用：payload 里的文件被复制进新项目后，
        # 任何指向「不随模板复制」的文件的引用都会变成死链（历史上 TEMPLATE.md
        # 就因此在每个新项目里都是死链）。
        #
        # 校验两种写法：
        #   1) Markdown 链接 ](path)
        #   2) 反引号路径 `path.ext`（文档里更常见，例如 AGENTS.md 里的 .agents/architecture.md）
        # 路径按「相对当前目录」与「相对仓库根」两种方式解析——payload 里的文档
        # 习惯写仓库根相对路径。
        #
        # 排除项（否则全是假阳性）：
        #   NNNN-kebab-title.md  占位文件名，不是真引用
        #   ./scripts/x.sh       行内示例文本
        #   不含 / 的裸文件名     简称而非路径（如 `build.yml` 指 .github/workflows/build.yml）
        run: |
          set -eu
          DST="$RUNNER_TEMP/linkcheck"
          ./scripts/template-init.sh "$DST" >/dev/null
          cd "$DST"
          # 注意：管道左侧的 while 在子 shell 里，计数要用命令替换取出，
          # 不能靠变量传递（set -e 也捕获不到管道左侧失败）
          n=$(find . -name '*.md' -not -path './.git/*' | while IFS= read -r f; do
                d=$(dirname "$f")
                {
                  # 1) Markdown 链接
                  grep -o '](\([^)]*\))' "$f" 2>/dev/null | sed 's/^](//; s/)$//'
                  # 2) 反引号里带斜杠的路径引用（只取含 / 的，裸文件名是简称）
                  grep -o '`[A-Za-z0-9_.-]*/[A-Za-z0-9_./-]*`' "$f" 2>/dev/null | tr -d '`'
                } | sort -u | while IFS= read -r l; do
                  base="${l%%#*}"
                  case "$base" in
                    http*|mailto:*|"") continue ;;
                    NNNN-*|*.example|./scripts/*) continue ;;
                    # 其他 AI 工具的目录约定：文档里说明映射位置用，仓库不预置，不是死链
                    .claude/*|.cursor/*) continue ;;
                  esac
                  [ -e "$d/$base" ] || [ -e "$base" ] || echo "${f#./} → ${l}"
                done
              done | tee "$RUNNER_TEMP/deadlinks" | wc -l)
          [ "$n" -eq 0 ] || { echo "产物内存在 $n 处死链："; cat "$RUNNER_TEMP/deadlinks"; exit 1; }
          echo "产物内文档引用全部可达"

  # 变更检测：按改动范围收窄 example 检查的调用时机（断言与检查命令一字未动）。
  # 规则（fail-safe，拿不准就跑）：
  #   push（仅 main）→ 两个示例全量（合并后兜底，防「没改但本来就坏」漏检）
  #   PR → 只跑改动涉及的示例；ci.yml 自身有改动 → 两个都跑（验证新检查逻辑）
  # 下游用 != 'false' 守卫：只有显式判定「没改」才跳过；本 job 失败 / 无输出 → 照跑。
  # 跳过的 job 报 Success（GitHub 官方语义），不阻塞分支保护的 required check。
  changes:
    name: Change detection
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.detect.outputs.python }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判定示例检查范围
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "push 事件（main），示例全量检查"
            exit 0
          fi
          # 与 Changelog gate 同基准：merge-base，不用 base.sha 直接 diff
          # （base.sha 随 main 前进，会把 main 上的改动误算进 PR）
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          python=false
          rust=false
          if printf '%s\n' "$CHANGED" | grep -q '^example/python/'; then python=true; fi
          if printf '%s\n' "$CHANGED" | grep -q '^example/rust-slint/'; then rust=true; fi
          # 检查逻辑自身变了 → 两个示例都跑
          if printf '%s\n' "$CHANGED" | grep -q '^\.github/workflows/ci\.yml$'; then python=true; rust=true; fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "改动文件："; printf '%s\n' "$CHANGED"
          echo "→ python=$python rust=$rust"

  python-example:
    name: Python example (ruff + pytest)
    needs: changes
    # 只有显式 false 才跳过（见 changes job 的 fail-safe 说明）；拿不准 → 照跑。
    if: needs.changes.outputs.python != 'false' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: 依赖方向门禁 (import-linter)
        # 分层合同见 pyproject.toml [tool.importlinter]，是 architecture.md §2 的可抄样板
        run: lint-imports
      - name: Pytest
        run: pytest

  rust-example:
    name: Rust example (fmt + clippy + test)
    needs: changes
    # 只有显式 false 才跳过（见 changes job 的 fail-safe 说明）；拿不准 → 照跑。
    if: needs.changes.outputs.rust != 'false' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example/rust-slint
    steps:
      - uses: actions/checkout@v7
      - name: System deps (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-composite0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example/rust-slint
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # 门禁：改了 template/（payload）却没同步根 CHANGELOG，就拦下。
  # 对齐根 AGENTS.md §5 DoD「改动了 template/ 就同步 CHANGELOG」——此前只靠自觉、已多次漏记。
  # 要让它真正阻断合并，请把这个 job 一并设为分支保护的 required status check。
  changelog:
    name: Changelog gate (template/)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查改动 template/ 是否同步了 CHANGELOG
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.body, '[skip changelog]') }}
        run: |
          set -eu
          if [ "$SKIP_CHANGELOG" = "true" ]; then
            echo "PR 含 [skip changelog]，跳过"
            exit 0
          fi
          # diff 基准必须取 merge-base，不能直接用 pull_request.base.sha ——
          # 后者会随 main 前进而变化，于是 main 在分叉点之后改过的文件（含
          # CHANGELOG.md）会被算进「本次 PR 的改动」，门禁在 PR 根本没补记录时假绿。
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          if ! printf '%s\n' "$CHANGED" | grep -q '^template/'; then
            echo "未改动 template/，跳过"
            exit 0
          fi
          if printf '%s\n' "$CHANGED" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md 已同步"
            exit 0
          fi
          echo "::error::改动了 template/ 必须在根 CHANGELOG.md 的 [Unreleased] 记录（或 PR 描述加 [skip changelog]）"
          exit 1

  # 发版守卫：与本仓库教给生成项目的能力对齐（template/.github/workflows/build.yml 的同名 job）。
  # tag 不可逆，把 §3「发版」的前置条件从文档里的自觉改成可回滚的失败。
  release-guard:
    name: Release guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: tag 与 CHANGELOG / ROADMAP 一致性
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          printf 'tag=%s version=%s\n' "$TAG" "$VER"
          if ! grep -qE "^## \[$VER\] - " CHANGELOG.md; then
            printf '::error::根 CHANGELOG.md 缺少版本节 [%s] - 日期（tag 为 %s）\n' "$VER" "$TAG"
            exit 1
          fi
          if grep -qE '\|[[:space:]]*in-progress[[:space:]]*\|' ROADMAP.md; then
            printf '::error::ROADMAP.md 仍有 in-progress 行，发版前置未满足\n'
            exit 1
          fi
          printf 'release guard 通过\n'
