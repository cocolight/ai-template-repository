name: CI

# 本工作流用于测试「模板仓库自身」：校验脚本、用 example/ 当活文档跑 lint+test。
# 新项目请改用随模板生成的 .github/workflows/build.yml（本文件不会被复制进新项目）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# runner 镜像显式钉版本，不跟随 ubuntu-latest：
# GitHub 计划于 2026-10-19 把 ubuntu-latest 迁移到 Ubuntu 26，隐式跟随会让 CI
# 在镜像切换当天突然改变行为。升级镜像前请先在分支上验证系统依赖。
jobs:
  template:
    name: Template (shellcheck + init dry-run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: template-init dry-run smoke test
        run: ./scripts/template-init.sh --dry-run "$RUNNER_TEMP/newproj"

  python-example:
    name: Python example (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  rust-example:
    name: Rust example (fmt + clippy + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example/rust-slint
    steps:
      - uses: actions/checkout@v7
      - name: System deps (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-composite0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example/rust-slint
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
